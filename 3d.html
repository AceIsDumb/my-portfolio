<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chace Tan | Developer &amp; Designer</title>
<meta name="description" content="Chace Tan, a Year 1 Computer Science student at Singapore Polytechnic, fullstack developer and designer. Walk down the tunnel to explore projects, features, achievements and skills.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Monocraft';font-display:swap;
    src:url('resources/Monocraft.woff2') format('woff2')}
  :root{
    --fg:#e8e8e8; --muted:#a8a8a8; --yellow:#ffff55; --green:#55ff55; --aqua:#55ffff;
    --px:'Monocraft','Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
    --body:'Monocraft','VT323',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body,button{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;-webkit-font-smoothing:none;font-smooth:never}
  html{background:#070403}
  body{margin:0;color:var(--fg);font-family:var(--body);font-size:18px;background:#070403}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y}
  #scene.pointer{cursor:pointer}
  #spacer{width:1px}

  /* Minecraft-style button */
  .mc,.btn{display:inline-block;font-family:var(--px);font-size:14px;line-height:1.3;color:#fff;text-decoration:none;
    text-shadow:2px 2px 0 #3f3f3f;background:#6f6f6f;border:2px solid #000;cursor:pointer;
    box-shadow:inset -3px -3px 0 #3d3d3d, inset 3px 3px 0 #a5a5a5;padding:12px 16px}
  .mc:hover,.btn:hover,.mc:focus-visible,.btn:focus-visible{background:#7b84c8;box-shadow:inset -3px -3px 0 #4a4f84, inset 3px 3px 0 #b3b8ee;outline:none}
  .btn{margin:6px 8px 0 0}

  /* title screen */
  #title{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 0%,rgba(0,0,0,.6) 100%)}
  #title .logo{position:relative;display:inline-block}
  #title h1{margin:0;font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;font-weight:400;font-size:clamp(30px,8.5vw,92px);letter-spacing:.02em;color:#d4d4d4;
    text-shadow:0 4px 0 #8a8a8a,0 8px 0 #4a4a4a,0 12px 0 #2a2a2a,0 18px 24px rgba(0,0,0,.7)}
  #title .sub{margin:26px 0 34px;font-family:var(--px);font-size:clamp(14px,2.4vw,22px);color:#fff;text-shadow:3px 3px 0 #3f3f3f}
  #splash{position:absolute;right:-6%;bottom:-18px;transform:rotate(-18deg);font-family:var(--px);color:var(--yellow);
    font-size:clamp(13px,2vw,22px);text-shadow:3px 3px 0 #3f3f00;white-space:nowrap;animation:pulse .6s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:rotate(-18deg) scale(1)}to{transform:rotate(-18deg) scale(1.08)}}
  #title .mc{pointer-events:auto}
  #title .btns{display:flex;flex-direction:column;align-items:center;gap:14px}
  #title .btns .mc{min-width:min(300px,80vw)}
  #title .tip{margin-top:22px;font-size:16px;color:#e0d2c0;text-shadow:2px 2px 0 #222;white-space:pre-line}

  /* top bar, F3 text, crosshair */
  #brand{position:fixed;top:14px;right:14px;z-index:6;font-size:13px;padding:10px 12px}
  #f3{position:fixed;top:10px;left:12px;z-index:5;font-size:15px;line-height:1.3;color:#fff;pointer-events:none;white-space:pre}
  #f3 span{background:rgba(60,60,60,.55);padding:0 4px}
  #cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s}
  #cross.vis{opacity:.9}
  #cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.75)}
  #cross:before{left:10px;top:0;width:2px;height:22px}
  #cross:after{left:0;top:10px;width:22px;height:2px}
  #cross.on:before,#cross.on:after{background:var(--yellow)}

  /* hotbar + prompt */
  #hotbar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
    display:flex;gap:0;padding:4px;background:rgba(20,20,20,.6);border:3px solid #1b1b1b}
  #mobileControls{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
    display:none;gap:8px;padding:4px;background:rgba(20,20,20,.68);border:3px solid #1b1b1b}
  #mobileControls .mc{margin:0;padding:10px 12px;font-size:12px;min-width:74px}
  #mobileControls .mc[disabled]{opacity:.6;cursor:not-allowed}
  .slot{position:relative;width:56px;height:56px;margin:0;padding:0;background:rgba(110,110,110,.45);border:3px solid #3a3a3a;
    color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .slot:hover{background:rgba(160,160,200,.5)}
  .slot .ico{width:32px;height:32px;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
  .slot.active{border-color:#fff;outline:3px solid #000;z-index:1}
  .slot i{position:absolute;right:3px;bottom:0;font:normal 14px var(--body);color:#fff;text-shadow:2px 2px 0 #222}
  .slot .tt{display:none;position:absolute;bottom:68px;left:50%;transform:translateX(-50%);white-space:nowrap;font:15px var(--body);
    background:rgba(16,0,16,.92);border:2px solid #2a0a5e;padding:3px 8px;color:#fff;pointer-events:none}
  .slot:hover .tt{display:block}
  #prompt{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:6;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
  #prompt.show{opacity:1;pointer-events:auto}

  /* content panel (inventory style) */
  #panel{position:fixed;z-index:7;top:64px;right:20px;bottom:96px;width:min(480px,calc(100vw - 40px));
    background:#232323;border:4px solid #000;box-shadow:inset 4px 4px 0 #5a5a5a, inset -4px -4px 0 #111;
    padding:24px 24px 28px;overflow-y:auto;color:#e6e6e6;line-height:1.4;
    transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none;transition:transform .45s steps(8),opacity .25s}
  #panel.open{transform:none;opacity:1;pointer-events:auto}
  #close{float:right;font-size:13px;padding:9px 11px}
  .eyebrow{font-family:var(--px);font-size:12px;letter-spacing:.06em;color:var(--green);margin:4px 0 12px}
  h2{font-family:var(--px);font-weight:400;font-size:22px;line-height:1.3;margin:0 0 16px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;clear:both}
  h3{font-family:var(--px);font-weight:400;font-size:16px;line-height:1.4;margin:0 0 8px;color:#fff}
  p{margin:0 0 12px;color:#dcdcdc;font-size:18px;line-height:1.5}
  a{color:var(--aqua)}
  .avatar{width:96px;height:96px;object-fit:cover;border:3px solid #000;box-shadow:0 0 0 3px #555;margin:4px 0 18px;background:#111}
  .card{border:2px solid #000;background:#2f2f2f;box-shadow:inset 2px 2px 0 #4c4c4c, inset -2px -2px 0 #1a1a1a;margin:16px 0}
  .card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#111;border-bottom:2px solid #000}
  .card .cb{padding:14px 16px 16px}
  .meta{font-size:15px;color:var(--muted);margin-bottom:8px}
  .year{font-family:var(--px);font-size:14px;color:var(--yellow);margin:22px 0 6px;text-shadow:2px 2px 0 #3f3f00}
  ul.plain{list-style:none;margin:0;padding:0}
  ul.plain li{padding:8px 0 8px 18px;position:relative;font-size:18px;line-height:1.4;border-bottom:2px solid #333}
  ul.plain li:before{content:"";position:absolute;left:0;top:16px;width:8px;height:8px;background:var(--green)}
  .group{font-family:var(--px);font-size:13px;color:var(--yellow);margin:20px 0 8px}
  .chip{display:inline-block;padding:4px 12px;margin:0 8px 8px 0;font-size:16px;background:#3a3a3a;border:2px solid #000;
    box-shadow:inset 2px 2px 0 #5c5c5c, inset -2px -2px 0 #222}

  #fallback{display:none}
  body.nogl #scene,body.nogl #spacer,body.nogl #title,body.nogl #hotbar,body.nogl #mobileControls,body.nogl #prompt,body.nogl #panel,body.nogl #f3,body.nogl #brand,body.nogl #cross{display:none}
  body.nogl #fallback{display:block;max-width:720px;margin:0 auto;padding:40px 20px 80px}
  body.nogl #fallback section{margin-bottom:48px}

  @media (max-width:760px){
    body{font-size:16px}
    #f3{display:none}
    #brand{top:10px;right:10px;padding:8px 10px}
    .slot{width:46px;height:46px;font-size:22px}
    #hotbar{bottom:max(8px,env(safe-area-inset-bottom))}
    #mobileControls{gap:6px;bottom:calc(62px + env(safe-area-inset-bottom))}
    #mobileControls .mc{min-width:64px;padding:9px 10px;font-size:11px}
    #panel{
      top:max(8px,env(safe-area-inset-top));left:8px;right:8px;
      bottom:calc(118px + env(safe-area-inset-bottom));width:auto;
      padding:18px 16px 20px
    }
    #close{position:sticky;top:0;z-index:1}
    #prompt{bottom:calc(112px + env(safe-area-inset-bottom));max-width:calc(100vw - 20px);text-align:center}
    #splash{right:-2%}
  }
  @media (pointer:coarse){
    #cross{display:none}
    #prompt{display:none}
    #mobileControls{display:flex}
  }
  @media (prefers-reduced-motion:reduce){ #splash{animation:none} #panel{transition:opacity .2s} }
</style>
</head>
<body>
<canvas id="scene" aria-label="First-person 3D tunnel. Scroll to walk, move the mouse to look, right-click a portal to enter."></canvas>

<section id="title">
  <div class="logo">
    <h1>CHACE TAN</h1>
    <div id="splash">Scroll to walk!</div>
  </div>
  <p class="sub">Developer &amp; Designer</p>
  <div class="btns">
    <button class="mc" id="start">&#9660; Start walking</button>
    <button class="mc" id="aboutBtn">About this site</button>
  </div>
  <div class="tip" id="tip"></div>
</section>

<button class="mc" id="brand" aria-label="Back to start">CT</button>
<div id="f3" aria-hidden="true"></div>
<div id="cross" aria-hidden="true"></div>
<button class="mc" id="prompt"></button>
<div id="mobileControls" role="toolbar" aria-label="Mobile tunnel controls">
  <button class="mc" id="mPrev" aria-label="Go to previous portal">◀ Prev</button>
  <button class="mc" id="mUse" aria-label="Enter nearest portal">Enter</button>
  <button class="mc" id="mNext" aria-label="Go to next portal">Next ▶</button>
  <button class="mc" id="mClose" aria-label="Close panel">Close</button>
</div>
<div id="hotbar" role="toolbar" aria-label="Jump to a section"></div>

<aside id="panel" aria-live="polite">
  <button class="mc" id="close">X Close</button>
  <div id="panelBody"></div>
</aside>

<div id="spacer"></div>
<div id="fallback"></div>
<noscript><p style="padding:24px">This site needs JavaScript. Find me on <a href="https://github.com/AceIsDumb">GitHub</a>.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     0. OPTIONAL TEXTURE PACK
     Everything is drawn in code by default. If you have your own 16x16
     PNGs (e.g. from a resource pack you made), put their paths here and
     they replace the drawn ones. Leave null to keep the drawn textures.
     ------------------------------------------------------------------ */
  var PACK = {
    wall:  'resources/mud_bricks.png',   // walls, ledges, arch, pillars
    floor: 'resources/packed_mud.png',          // walkway
    frame: 'resources/obsidian.png',     // portal frames
    gravel: null                                                  // optional wall patches, e.g. '.../gravel.png'
  };

  /* ------------------------------------------------------------------
     1. CONTENT  (edit this block to change what each portal shows)
     ------------------------------------------------------------------ */
  var IMG = 'resources/';

  // hotbar icons: flat 16x16 item PNGs in resources/ (if one is missing, the emoji below is shown instead)
  var ICONS = {
    about: 'book.png',
    projects: 'diamond_pickaxe.png',
    participation: 'experience_bottle.png',
    skills: 'enchanted_book.png',
    contact: 'ender_pearl.png'
  };

  function projectCard(img, title, desc, url) {
    return '<div class="card"><img loading="lazy" src="' + IMG + img + '" alt="' + title + '">' +
      '<div class="cb"><h3>' + title + '</h3><p>' + desc + '</p>' +
      '<a class="btn" href="' + url + '" target="_blank" rel="noopener">View project</a></div></div>';
  }
  function featureCard(img, title, desc, source, url, cta) {
    return '<div class="card"><img loading="lazy" src="' + IMG + img + '" alt="' + title + '">' +
      '<div class="cb"><h3>' + title + '</h3><div class="meta">' + source + '</div><p>' + desc + '</p>' +
      '<a class="btn" href="' + url + '" target="_blank" rel="noopener">' + cta + '</a></div></div>';
  }
  function yearList(year, items) {
    return '<div class="year">' + year + '</div><ul class="plain">' +
      items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>';
  }
  function chips(group, items) {
    return '<div class="group">' + group + '</div>' +
      items.map(function (i) { return '<span class="chip">' + i + '</span>'; }).join('');
  }

  // right-click the black doorway at the end of the tunnel to open this link
  var END_LINK_URL = 'https://www.youtube.com/watch?v=3V7Rvo4Gvic';

  var SECTIONS = [
    {
      id: 'about', label: 'ABOUT', color: '#55ffff', icon: '📖',
      html:
        '<p class="eyebrow">About</p><h2>Chace Tan</h2>' +
        '<img class="avatar" src="' + IMG + 'profile.png" alt="Chace Tan">' +
        '<p>Hello &#128075; I\'m Chace, a Year 1 student studying the Diploma in Computer Science at Singapore Polytechnic, and a fullstack developer and designer.</p>' +
        '<a class="btn" data-go="projects" href="#projects">View my work</a>'
    },
    {
      id: 'projects', label: 'PROJECTS', color: '#b084ff', icon: '⛏️',
      html:
        '<p class="eyebrow">Featured projects</p><h2>Projects</h2>' +
        projectCard('Open%20house.png', 'SST Open House App', 'App for guests during SST\'s Open House!', 'https://github.com/sst-inc/openhouseapp2024') +
        projectCard('Virtual%20tour.png', 'SST Virtual Tour', 'A web-based virtual tour of SST!', 'https://github.com/tedydevmac/virtualtour') +
        projectCard('Sokudo.png', 'Sokudo!', 'A mental health chatbot built on Gemini 2.0!', 'https://github.com/AceIsDumb/sokudo')
    },
    {
      id: 'participation', label: 'participation', color: '#ffc94d', icon: '🏆',
      html:
        '<p class="eyebrow">Timeline</p><h2>Participation &amp; Achievements</h2>' +
        yearList('2026', ['National AI Student Challenge 2026']) +
        yearList('2025', ['Perse Coding Team Challenge 2025 &mdash; Distinction', 'PicoCTF 2025', 'UgraCTF 2025',
          'BuildingBloCS March Conference', 'National Software Competition 2025 &mdash; 1st Place', 'BuildingBloCS June Conference', 'UIUCTF']) +
        yearList('2024', ['Perse Coding Team Challenge 2024 &mdash; Merit', 'Hackomania 2024', 'BlahajCTF 2024',
          'AWS DeepRacer workshop @ Republic Polytechnic', 'Astronaut Al Worden Endeavour Space Camp Challenge']) +
        yearList('2023', ['Scouts Leadership Camp', 'Singapore Amazing Flying Machine Competition', 'Drone Odyssey Challenge']) +
        yearList('2022', ['SST Inc. 2022&ndash;present', 'Spark AR Bootcamp', 'SenseTime AI Bootcamp']) +
        '<p style="margin-top:20px"><a class="btn" href="https://drive.google.com/drive/u/0/folders/1P4-Fhumd1dSc5KXWh8ZEBxnPKKWt0F_J" target="_blank" rel="noopener">Certificates</a>' +
        '<a class="btn" href="https://drive.google.com/drive/u/0/folders/1pjUcmnEH74zQWtAGmwNzxT_4BXOJdKvD" target="_blank" rel="noopener">Recommendation</a></p>'
    },
    {
      id: 'skills', label: 'skills', color: '#55ff88', icon: '⚔️',
      html:
        '<p class="eyebrow">Toolbox</p><h2>Skills</h2>' +
        chips('Frontend', ['HTML', 'CSS', 'JavaScript', 'React', 'Next.js', 'TailwindCSS']) +
        chips('Backend', ['Python', 'Django', 'Flask', 'Node.js', 'Java']) +
        chips('Mobile', ['Swift', 'React Native', 'Flutter']) +
        chips('Design &amp; tools', ['Figma', 'Git'])
    },
    {
      id: 'contact', label: 'contact', color: '#6fa8ff', icon: '✉️',
      html:
        '<p class="eyebrow">Say hi</p><h2>Find me on</h2>' +
        '<p>Talk to me! Open to connect on linkedin!</p>' +
        '<a class="btn" href="https://github.com/AceIsDumb" target="_blank" rel="noopener">GitHub</a>' +
        '<a class="btn" href="https://www.linkedin.com/in/chace-tan-ba72162ba/" target="_blank" rel="noopener">LinkedIn</a>' +
        '<p style="margin-top:30px;font-size:15px;color:#a8a8a8">&copy; Made by Chace :3</p>'
    }
  ];
  var BY_ID = {};
  SECTIONS.forEach(function (s, i) { s.index = i; BY_ID[s.id] = s; });

  /* ------------------------------------------------------------------
     2. DOM + FALLBACK
     ------------------------------------------------------------------ */
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('scene'), panel = $('panel'), panelBody = $('panelBody'),
      prompt = $('prompt'), hotbar = $('hotbar'), titleEl = $('title'), spacer = $('spacer'),
      f3 = $('f3'), cross = $('cross'),
      mPrev = $('mPrev'), mUse = $('mUse'), mNext = $('mNext'), mClose = $('mClose');

  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var usingTouch = coarse;
  $('tip').textContent = coarse
    ? 'Scroll to walk · drag sideways to look · tap a portal to enter\n use mobile controls for easier prev/next + enter'
    : 'Scroll to walk · move your mouse to look · right-click a portal to enter\n please excuse any bugs as i push to prod for testing :3';

  var SPLASHES = ['Scroll to walk!', 'Year 1 @ SP!', 'Also try Python!', 'Made by Chace :3', 'Hackathon approved!',
    '100% blocky!', 'Ship it!', 'Now in 3D!', 'No world beyond!', 'Torches included!'];
  $('splash').textContent = SPLASHES[Math.floor(Math.random() * SPLASHES.length)];

  function showFallback() {
    document.body.classList.add('nogl');
    $('fallback').innerHTML =
      '<h1 style="font-family:var(--px);font-size:28px;margin-bottom:6px">Chace Tan</h1><p>Developer &amp; Designer</p>' +
      SECTIONS.map(function (s) { return '<section id="' + s.id + '">' + s.html + '</section>'; }).join('');
  }
  if (typeof THREE === 'undefined') { showFallback(); return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (e) { showFallback(); return; }

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------------
     3. WORLD CONSTANTS
     Cross-section (x): walkway |x|<2.5 at y=0, slab ledge 2.5..3.5 at y=.5,
     block ledge 3.5..4.5 at y=1, wall up to y=5, then two corbel steps
     (y5-6 inset 1, y6-7 inset 2) closing into a flat ceiling at y=7.
     ------------------------------------------------------------------ */
  var Z_BACK = 6, Z_END = -126;
  var LEN = Z_BACK - Z_END;                 // 132
  var MID = (Z_BACK + Z_END) / 2;           // -60
  var START_Z = 3, END_Z = -117;
  var DOOR_Z = SECTIONS.map(function (s, i) { return -(18 + i * 24); });
  var SIDE = SECTIONS.map(function (s, i) { return i % 2 === 0 ? -1 : 1; });   // -1 left wall, 1 right wall
  var STOP_OFFSET = 6.5;                    // hotbar jumps stop this many blocks before the portal
  var PORTAL_W = 2;                         // interior width in blocks (the game uses 2 wide x 3 tall)
  var PORTAL_HW = PORTAL_W / 2 + 0.5;       // centre of the frame posts

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x070403, 1);
  var MAXA = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x070403, 8, 56);
  var camera = new THREE.PerspectiveCamera(74, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var R = rng(20261111);
  function h2(a, b) { var s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }

  /* ------------------------------------------------------------------
     4. DRAWN PIXEL TEXTURES (16x16)
     ------------------------------------------------------------------ */
  function c255(v) { return Math.max(0, Math.min(255, v | 0)); }
  function px(g, x, y, c, d) {
    g.fillStyle = 'rgb(' + c255(c[0] + d) + ',' + c255(c[1] + d) + ',' + c255(c[2] + d) + ')';
    g.fillRect(x, y, 1, 1);
  }
  function makeTex(draw) {
    var c = document.createElement('canvas'); c.width = c.height = 16;
    draw(c.getContext('2d'));
    var t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = MAXA;
    return t;
  }
  function blotch(x, y, seed) { return (h2((x >> 2) + seed, (y >> 2) + seed * 2) - 0.5) * 20; }

  var T = {
    // long running-bond bricks, two rows per block (matches the reference screenshot)
    wall: makeTex(function (g) {
      var base = [160, 126, 92], x, y;
      for (y = 0; y < 16; y++) for (x = 0; x < 16; x++) {
        var row = y >> 3, jx = row === 0 ? 0 : 8, ly = y & 7;
        var d = (h2(row + 3, 5) - 0.5) * 24 + blotch(x, y, 3) + (R() - 0.5) * 16;
        if (ly === 0 || x === jx) d -= 52;
        else if (ly === 1) d += 10;
        else if (ly === 7) d -= 12;
        px(g, x, y, base, d);
      }
    }),
    // darker tile floor with square flagstones
    floor: makeTex(function (g) {
      var base = [112, 90, 70], x, y;
      for (y = 0; y < 16; y++) for (x = 0; x < 16; x++) {
        var d = (h2((x >> 3) + 11, (y >> 3) + 2) - 0.5) * 28 + blotch(x, y, 7) + (R() - 0.5) * 14;
        if ((x & 7) === 0 || (y & 7) === 0) d -= 46;

    // obsidian-style fallback: near-black violet with purple flecks
    frame: makeTex(function (g) {
      var base = [20, 12, 34], x, y, i;
      for (y = 0; y < 16; y++) for (x = 0; x < 16; x++) px(g, x, y, base, (R() - 0.5) * 14 + blotch(x, y, 13) * 0.5);
      for (i = 0; i < 26; i++) px(g, Math.floor(R() * 16), Math.floor(R() * 16), [78, 40, 122], (R() - 0.5) * 30);

      var g = c.getContext('2d'), x, y;

        if (m > 0.32) {

  var packMats = { wall: [], floor: [], frame: [], gravel: [] };
  function phong(key, rx, ry, tint) {
    var t = T[key].clone(); t.repeat.set(rx, ry); t.needsUpdate = true;
    var m = new THREE.MeshPhongMaterial({ map: t, shininess: 0, specular: 0x000000 });
    if (tint) m.color.setHex(tint);

  }

  var glowTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.25, 'rgba(255,255,255,0.45)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');

    return new THREE.CanvasTexture(c);
  })();

  /* signs (wood board + pixel font) */
  var signRedraws = [];
  function makeSign(text, W, H, sub) {
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d');
    var tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
    function fit(str, size, maxW) {
      do { g.font = size + 'px "Monocraft", "Press Start 2P", monospace'; size -= 2; }
      while (g.measureText(str).width > maxW && size > 8);
    }
    function draw() {
      g.clearRect(0, 0, W, H);
      g.fillStyle = '#9c7a45'; g.fillRect(0, 0, W, H);
      for (var i = 0; i < 300; i++) {
        g.fillStyle = i % 2 ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.07)';
        g.fillRect((i * 37) % W, (i * 53) % H, 10, 4);
      }
      g.fillStyle = '#5b4222';
      g.fillRect(0, 0, W, 6); g.fillRect(0, H - 6, W, 6); g.fillRect(0, 0, 6, H); g.fillRect(W - 6, 0, 6, H);
      g.fillStyle = '#1d1206'; g.textAlign = 'center'; g.textBaseline = 'middle';
      fit(text, Math.floor(H * (sub ? 0.36 : 0.48)), W - 40);
      g.fillText(text, W / 2, sub ? H * 0.36 : H / 2 + 2);
      if (sub) { fit(sub, Math.floor(H * 0.17), W - 40); g.fillText(sub, W / 2, H * 0.74); }
      tex.needsUpdate = true;
    }
    draw(); signRedraws.push(draw);
    return tex;
  }
  if (document.fonts && document.fonts.load) {

  /* ------------------------------------------------------------------

  function addPlane(w, h, mat, x, y, z, rx, ry) {

    m.position.set(x, y, z); m.rotation.x = rx || 0; m.rotation.y = ry || 0;
    scene.add(m); return m;
  }

  // horizontal planes along the hall: (width across x, LEN along z)
  function flat(w, y, x, key, facingUp, tint) {
    addPlane(w, LEN, phong(key, w, LEN, tint), x, y, MID, facingUp ? UPR : DOWN, 0);
  }
  // vertical planes along the hall facing the centre: (LEN along z, h tall)
  function vert(h, y, x, key, tint) {
    var inward = x < 0 ? Math.PI / 2 : -Math.PI / 2;          // left wall faces +x, right wall faces -x
    addPlane(LEN, h, phong(key, LEN, h, tint), x, y, MID, 0, inward);
  }

    vert(0.5, 0.25, s * 2.5, 'wall', 0xbdbdbd);                 // slab riser
    flat(1, 1.0, s * 4, 'wall', true, 0xcfcfcf);                // block ledge top
    vert(0.5, 0.75, s * 3.5, 'wall', 0xbdbdbd);                 // block riser
    vert(4, 3.0, s * 4.5, 'wall');                              // wall y1..5
    flat(1, 5, s * 4, 'wall', false, 0xb0b0b0);                 // corbel A underside
    vert(1, 5.5, s * 3.5, 'wall', 0xc4c4c4);                    // corbel A face
    flat(1, 6, s * 3, 'wall', false, 0xa8a8a8);                 // corbel B underside
    vert(1, 6.5, s * 2.5, 'wall', 0xb8b8b8);                    // corbel B face

    0, 5.5, Z_END + 0.06, 0, 0);

  function inDoorBay(side, z) {

  }

  for (var gi = 0; gi < 16; gi++) {
    var gz = -6 - gi * 8.8 - R() * 4, gs = gi % 2 ? 1 : -1;

  /* pillars (wall) and ribs (ceiling) every 8 blocks, built from real 1x1x1 blocks

  var cubeGeo = new THREE.BoxGeometry(1, 1, 1);
  var pillarZs = [];
  for (var pz = 2; pz > Z_END + 3; pz -= 8) pillarZs.push(pz);

  pillarZs.forEach(function (pz) {

      if (inDoorBay(s, pz)) return;
      for (var py = 0; py < 4; py++) pillarPos.push([s * 4, 1.5 + py, pz]);
    });

  function instanced(positions, mat) {
    var im = new THREE.InstancedMesh(cubeGeo, mat, positions.length), m4 = new THREE.Matrix4();
    positions.forEach(function (p, i) { m4.setPosition(p[0], p[1], p[2]); im.setMatrixAt(i, m4); });
    im.instanceMatrix.needsUpdate = true;
    im.frustumCulled = false;

  }

  instanced(ribPos, phong('wall', 1, 1, 0xb89a80));

  /* torches along the walls; real lights are pooled below */

  var stickMat = new THREE.MeshPhongMaterial({ color: 0x6b4a22, shininess: 0, specular: 0x000000 });
  var flameGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
  var flameMat = new THREE.MeshBasicMaterial({ color: 0xffd25a });
  var glowMat = new THREE.SpriteMaterial({
    map: glowTex, color: 0xff9a3c, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.55, fog: false
  });
  var torchGlows = [];
  var sources = [];                              // pooled light candidates
  for (var tz = 0; tz > Z_END + 4; tz -= 12) {
    [-1, 1].forEach(function (s) {
      if (inDoorBay(s, tz)) return;
      var stick = new THREE.Mesh(stickGeo, stickMat); stick.position.set(s * 4.4, 2.6, tz); scene.add(stick);
      var flame = new THREE.Mesh(flameGeo, flameMat); flame.position.set(s * 4.4, 2.98, tz); scene.add(flame);
      var gl = new THREE.Sprite(glowMat.clone()); gl.scale.set(2.4, 2.4, 1); gl.position.set(s * 4.2, 3.0, tz); scene.add(gl);
      torchGlows.push({ sprite: gl, z: tz });
      sources.push({ x: s * 3.9, y: 3.0, z: tz, color: new THREE.Color(0xff9a40), base: 1.25, dist: 18, flick: tz, portal: null });
    });
  }

  /* lighting: warm ambient, a small light on the player, and a pool of
     lights that jump to whichever torches/portals are nearest. */
  scene.add(new THREE.AmbientLight(0x6a4a36, 1.0));
  var handLight = new THREE.PointLight(0xffb878, 0.8, 14, 1.5);
  camera.add(handLight);

  for (var pi = 0; pi < POOL; pi++) {

  }

  /* ------------------------------------------------------------------
     6. PORTALS (one per section)
     ------------------------------------------------------------------ */
  var PSX = PORTAL_W * 8, PSY = 24;                // 8 pixels per block so pixels stay square
  var hashGrid = [];
  for (var hy = 0; hy < PSX * PSY; hy++) hashGrid.push(R());

  function makePortalTexture(color) {
    var c = document.createElement('canvas'); c.width = PSX; c.height = PSY;
    var g = c.getContext('2d');
    var tint = new THREE.Color(color);
    var rgb = [tint.r * 255, tint.g * 255, tint.b * 255];
    var tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
    function update(t) {
      for (var y = 0; y < PSY; y++) for (var x = 0; x < PSX; x++) {
        var h = hashGrid[y * PSX + x];
        var v = 0.5 + 0.5 * Math.sin(x * 0.8 + y * 0.45 + t * 1.8 + h * 6.28);
        var k = 0.3 + 0.7 * v;
        g.fillStyle = 'rgb(' + (rgb[0] * k | 0) + ',' + (rgb[1] * k | 0) + ',' + (rgb[2] * k | 0) + ')';
        g.fillRect(x, y, 1, 1);

    }
    update(0);
    return { tex: tex, update: update };
  }

  var frameGeo = new THREE.BoxGeometry(1, 1, 0.8);
  var frameMat = phong('frame', 1, 1);
  var hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
  var portals = [];
  var hitTargets = [];

  SECTIONS.forEach(function (s, i) {
    var side = SIDE[i];
    var g = new THREE.Group();
    g.position.set(side * 4.1, 1.0, DOOR_Z[i]);                  // stands on the block ledge, against the wall
    g.rotation.y = side === -1 ? Math.PI / 2 : -Math.PI / 2;
    scene.add(g);

    // obsidian frame like the game's: 2 wide x 3 tall opening, top bar + two posts
    function block(x, y) { var b = new THREE.Mesh(frameGeo, frameMat); b.position.set(x, y, 0); g.add(b); }
    for (var bx = -PORTAL_HW; bx <= PORTAL_HW + 0.01; bx += 1) block(bx, 3.5);
    for (var by = 0; by < 3; by++) { block(-PORTAL_HW, by + 0.5); block(PORTAL_HW, by + 0.5); }

    var pt = makePortalTexture(s.color);
    var pm = new THREE.MeshBasicMaterial({ map: pt.tex, transparent: true, opacity: 0.88, side: THREE.DoubleSide });
    var plane = new THREE.Mesh(new THREE.PlaneGeometry(PORTAL_W, 3), pm);
    plane.position.set(0, 1.5, 0.1);
    g.add(plane);

    var sign = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.8),
      new THREE.MeshBasicMaterial({ map: makeSign(s.label, 512, 128) }));
    // sign sits fully clear of the frame (frame edge + 0.3 gap + half the sign width)
    var signX = PORTAL_HW + 0.5 + 0.3 + 1.6;
    sign.position.set(side === -1 ? -signX : signX, 2.0, -0.37);
    g.add(sign);

    var hit = new THREE.Mesh(new THREE.PlaneGeometry(PORTAL_W + 1.8, 3.6), hitMat);
    hit.position.set(0, 1.7, 0.5);
    hit.userData.id = s.id;
    g.add(hit);
    hitTargets.push(hit);

    var pobj = { id: s.id, mat: pm, tex: pt, glow: 0 };
    portals.push(pobj);
    sources.push({ x: side * 3.4, y: 2.6, z: DOOR_Z[i], color: new THREE.Color(s.color), base: 1.15, dist: 15, flick: 0, portal: pobj });
  });

  scene.add(endHit);
  hitTargets.push(endHit);

  /* texture pack: loads each PNG and swaps it in (the drawn textures show until it arrives, or if it fails).

  var texLoader = new THREE.TextureLoader();
  texLoader.setCrossOrigin('anonymous');

  });

  /* ------------------------------------------------------------------
     7. HOTBAR + PANEL + NAVIGATION
     ------------------------------------------------------------------ */
  var slots = [];
  SECTIONS.forEach(function (s, i) {
    var b = document.createElement('button');
    b.className = 'slot';
    b.setAttribute('aria-label', 'Go to ' + s.label.toLowerCase());

  function cap(l) { return l.charAt(0) + l.slice(1).toLowerCase(); }

  sizeSpacer();

  var ABOUT_HTML =
    '<p class="eyebrow">About this site</p><h2>How to explore</h2>' +
    '<ul class="plain">' +
    '<li><b>Scroll</b> &mdash; walk down the tunnel</li>' +

    '<li><b>1&ndash;' + SECTIONS.length + '</b> &mdash; jump to a portal</li>' +
    '<li><b>Esc</b> &mdash; back to the start menu</li>' +
    '<li><b>Touch</b> &mdash; drag sideways to look, tap a portal to enter</li>' +
    '<li><b>Mobile controls</b> &mdash; Prev/Next to move between portals and Enter to open</li>' +
    '</ul>' +
    '<div class="group">Built with</div>' +

    '<div class="group">Note</div>' +

    '<p style="margin-top:24px;font-size:15px;color:#a8a8a8">&copy; Made by Chace :3</p>';

  var openId = null, aboutOpen = false;

  /* ------------------------------------------------------------------

  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2();

  function dead(v) {

    ndc.x = (cx / window.innerWidth) * 2 - 1;
    ndc.y = -(cy / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(hitTargets, false);
    return (hits.length && hits[0].distance < maxDist) ? hits[0].object.userData.id : null;
  }

  var onStart = true;                       // true while the title screen is showing
  canvas.addEventListener('pointermove', function (e) {
    if (onStart) {                          // no looking around on the start screen
      usingTouch = e.pointerType === 'touch';
      canvas.classList.remove('pointer');
      return;
    }
    if (e.pointerType === 'touch') {
      usingTouch = true;
      if (touchDown) yawT = Math.max(-1.5, Math.min(1.5, yawT + (e.clientX - lastX) * 0.006));
      lastX = e.clientX;
      return;
    }
    usingTouch = false;
    yawT = -dead((e.clientX / window.innerWidth - 0.5) * 2) * 1.5;
    pitchT = -dead((e.clientY / window.innerHeight - 0.5) * 2) * 0.55;
    pointerHit = pickAt(e.clientX, e.clientY, 30);
    canvas.classList.toggle('pointer', !!pointerHit);
  });
  canvas.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch') { usingTouch = true; touchDown = true; lastX = e.clientX; return; }
    if (e.button === 2 && hoverId) interact(hoverId);          // right-click = "use"
  });
  function endTouch() { touchDown = false; }
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('click', function (e) {                  // tap, or left-click directly on a portal
    var id = pickAt(e.clientX, e.clientY, 30);
    if (id) interact(id);
  });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    sizeSpacer();
  });

  /* ------------------------------------------------------------------
     9. THE WALK
     ------------------------------------------------------------------ */
  function smoothstep(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

  var camZ = START_Z, prevZ = START_Z, vel = 0, bob = 0, fov = 74;
  var nearIdx = -1, lastPrompt = '';
  var clock = new THREE.Clock(), elapsed = 0, portalTimer = 0;
  var order = sources.map(function (s, i) { return i; });
  var d2 = new Array(sources.length);

  function updateLights() {
    var px_ = camera.position.x, py_ = camera.position.y, pz_ = camera.position.z, i;
    for (i = 0; i < sources.length; i++) {
      var s = sources[i], dx = s.x - px_, dy = s.y - py_, dz = s.z - pz_;
      d2[i] = dx * dx + dy * dy + dz * dz;
    }
    order.sort(function (a, b) { return d2[a] - d2[b]; });
    for (i = 0; i < POOL; i++) {
      var src = sources[order[i]], L = poolLights[i], dist = Math.sqrt(d2[order[i]]);
      L.position.set(src.x, src.y, src.z);
      L.color.copy(src.color);
      L.distance = src.dist;
      var inten = src.base * (1 - smoothstep(12, 22, dist));
      if (src.portal) inten *= 1 + src.portal.glow;
      else inten *= 1 + 0.08 * Math.sin(elapsed * 9 + src.flick);
      L.intensity = inten;
    }
  }

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    // scroll -> position down the tunnel
    var sy = window.pageYOffset || document.documentElement.scrollTop || 0;
    onStart = sy <= window.innerHeight * 0.32;
    if (onStart) { yawT = 0; pitchT = 0; }   // recentre the view on the start screen
    var p = Math.max(0, Math.min(1, sy / maxScroll()));
    var targetZ = START_Z + (END_Z - START_Z) * p;
    camZ += (targetZ - camZ) * (1 - Math.exp(-dt * (reduceMotion ? 20 : 6)));
    var v = Math.abs(camZ - prevZ) / Math.max(dt, 0.001);
    prevZ = camZ;
    vel += (Math.min(v, 12) - vel) * (1 - Math.exp(-dt * 8));

    // nearest portal (for prompt/hotbar)
    var nearest = -1, nearestD = 1e9, i;
    for (i = 0; i < SECTIONS.length; i++) {
      var dd = Math.abs(DOOR_Z[i] - camZ);
      if (dd < nearestD) { nearestD = dd; nearest = i; }
    }
    nearIdx = nearestD < 10 ? nearest : -1;

    // camera: walking bob + smoothed look
    if (!reduceMotion) bob += dt * (3 + vel * 0.9);
    var bobAmt = reduceMotion ? 0 : Math.min(1, vel / 6);
    camera.position.set(Math.sin(bob * 0.5) * 0.04 * bobAmt, 1.7 + Math.abs(Math.sin(bob)) * 0.07 * bobAmt, camZ);
    var lk = 1 - Math.exp(-dt * (reduceMotion ? 20 : 7));
    yaw += (yawT - yaw) * lk;
    pitch += (pitchT - pitch) * lk;
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
    var wantFov = openId ? 66 : 74;
    fov += (wantFov - fov) * (1 - Math.exp(-dt * 5));
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
    camera.updateMatrixWorld();

    // what the crosshair is aimed at (mouse only)
    hoverId = usingTouch ? null : pickAt(window.innerWidth / 2, window.innerHeight / 2, REACH);

    // portals + torches
    portalTimer += dt;
    var upd = portalTimer > 0.1;
    if (upd) portalTimer = 0;
    for (i = 0; i < portals.length; i++) {
      var pr = portals[i];
      if (upd) pr.tex.update(elapsed);
      var want = (hoverId === pr.id || openId === pr.id) ? 1 : 0;
      pr.glow += (want - pr.glow) * (1 - Math.exp(-dt * 8));
      pr.mat.opacity = 0.82 + 0.18 * pr.glow;
    }
    for (i = 0; i < torchGlows.length; i++) {
      var tg = torchGlows[i];
      tg.sprite.material.opacity = 0.5 + 0.12 * Math.sin(elapsed * 9 + tg.z);
    }
    updateLights();

    // HUD
    var landing = sy > window.innerHeight * 0.32;
    titleEl.style.opacity = String(1 - Math.max(0, Math.min(1, sy / (window.innerHeight * 0.3))));
    titleEl.style.visibility = landing ? 'hidden' : 'visible';
    cross.classList.toggle('vis', landing && !usingTouch);
    cross.classList.toggle('on', !!hoverId);
    for (i = 0; i < slots.length; i++) {
      slots[i].classList.toggle('active', i === nearIdx || SECTIONS[i].id === openId);
    }

    var target = hoverId || (nearIdx >= 0 ? SECTIONS[nearIdx].id : (camZ < END_Z + 5 ? 'end' : null));
    if (target && target !== openId) {
      var lab = target === 'end' ? 'the void' : cap(BY_ID[target].label);
      var txt = target === 'end'
        ? (usingTouch ? 'Enter the void ▸' : hoverId ? '[Right-click] Enter the void' : 'Look at the darkness, then right-click')
        : usingTouch ? 'Enter ' + lab + ' ▸'
        : hoverId ? '[Right-click] Enter ' + lab
        : 'Look at the ' + lab + ' portal, then right-click';
      promptTarget = target;
      if (txt !== lastPrompt) { prompt.textContent = txt; lastPrompt = txt; }
      prompt.classList.add('show');
    } else {
      promptTarget = null;
      prompt.classList.remove('show');
    }
    if (mUse) {
      var useTarget = activeMobileTarget();
      if (useTarget) {
        mUse.disabled = false;
        mUse.textContent = useTarget === 'end' ? 'Enter void' : 'Enter ' + cap(BY_ID[useTarget].label);
      } else {
        mUse.disabled = true;
        mUse.textContent = 'Enter';
      }
    }
    if (mClose) mClose.textContent = panel.classList.contains('open') ? 'Close' : 'Top';
    if (openId && Math.abs(camZ - (DOOR_Z[BY_ID[openId].index] + STOP_OFFSET)) > 16) closePanel();

    f3.innerHTML =
      '<span>Chace Tan Portfolio 1.0 (Singapore Polytechnic)</span>\n' +
      '<span>XYZ: 0.50 / 64.00 / ' + camZ.toFixed(2) + '</span>\n' +
      '<span>Walked: ' + Math.round(START_Z - camZ) + ' blocks</span>\n' +
      '<span>Targeted: ' + (hoverId ? (hoverId === 'end' ? 'void' : hoverId + '_portal') : 'none') + '</span>';

    renderer.render(scene, camera);
  }

  // deep link, e.g. chacetan.xyz/#projects
  var hash = (location.hash || '').slice(1);
  if (BY_ID[hash]) {
    setTimeout(function () { scrollToDoor(BY_ID[hash].index, true); openSection(hash, false); }, 60);
  }
  frame();
})();
</script>
